# playbooks/setup-pxe-server.yml
---
- name: Configure PXE boot server
  hosts: pxe_server
  become: true

  vars:


  roles:
    - apt-casher-ng-config
    - nfs-config
    - dnsmasq-config
    - pxeboot

  handlers:
    - name: restart dnsmasq
      ansible.builtin.service:
        name: dnsmasq
        state: restarted

    - name: restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
        
    - name: reload nfs exports
      ansible.builtin.command:
        cmd: exportfs -ra
        