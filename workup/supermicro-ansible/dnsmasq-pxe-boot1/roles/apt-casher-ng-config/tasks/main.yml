---
# based on https://github.com/elnappo/ansible-role-apt-cacher-ng/blob/master/tasks/main.yml
# https://www.atlantic.net/vps-hosting/how-to-set-up-apt-caching-server-using-apt-cacher-ng-on-ubuntu/

# tasks file for apt-cacher-ng
- name: Install apt-cacher-ng
  package:
    name: apt-cacher-ng
    state: present
    
- name: stop apt-cacher-ng before shanges to config
  service:
    name: apt-cacher-ng
    state: stopped

- name: Create CacheDir
  file:
    path: "{{ apt_cacher_ng_cache_dir }}"
    owner: "{{ apt_cacher_ng_cache_dir_owner }}"
    group: "{{ apt_cacher_ng_cache_dir_group }}"
    mode: 02755
    state: directory
    
- name: apt-cacher-ng user to vagrant so that it can write to the shared folder
  lineinfile:
    dest: /lib/systemd/system/apt-cacher-ng.service
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: "{{ item.state | default('present') }}"
  with_items:
    - { regexp: "^User=", line: "User=vagrant" }
    - { regexp: "^Group=", line: "Group=vagrant" }
    - { regexp: "^RequiresMountsFor=", line: "RequiresMountsFor={{ apt_cacher_ng_cache_dir }}" }
    - { regexp: "^Restart=", line: "Restart=no" }


- name: backup ng_cache acng.conf first time only
  copy: 
    src: /etc/apt-cacher-ng/acng.conf
    dest: /etc/apt-cacher-ng/acng.conf.bak
    force: no
    remote_src: true
    
  # note ^ matches the start of line. Relace if present or at end of file if commented
- name: Set config
  lineinfile:
    dest: /etc/apt-cacher-ng/acng.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: "{{ item.state | default('present') }}"
  with_items:
    - { regexp: "^Port:", line: "Port: {{ apt_cacher_ng_port }}" }
    - { regexp: "^CacheDir:", line: "CacheDir: {{ apt_cacher_ng_cache_dir }}" }
    - { regexp: "^PassThroughPattern:", line: "PassThroughPattern: .*" }


- name: Remove /etc/apt-cacher-ng/zz_debconf.conf
  file:
    path: /etc/apt-cacher-ng/zz_debconf.conf
    state: absent


- name: Enable apt-cacher-ng on boot
  service:
    name: apt-cacher-ng
    state: started
    enabled: true
    daemon_reload: true
    
- name:  apt-cacher-ng message  
  debug:
     msg: "apt-cacher-ng running on {{ dnsmasq_gateway }} port {{ apt_cacher_ng_port }} with cache dir {{ apt_cacher_ng_cache_dir }} info page at http://{{ dnsmasq_gateway }}:{{ apt_cacher_ng_port }}/acng-report.html"
