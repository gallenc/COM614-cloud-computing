---
# see https://oneuptime.com/blog/post/2026-03-02-how-to-set-up-apt-cacher-ng-for-package-caching-on-ubuntu/view

    - name: debug debian-apt-cacher.yml
      debug:
        msg: "generating apt cache config for os_id={{hostvars[inventory_hostname].os_id | default('', true) | trim }} os_version_id= {{ hostvars[inventory_hostname].os_version_id | default('', true) | trim }}"
          
    - name: Create debian apt-casher-ng
      ansible.builtin.copy:
           dest: "/etc/apt/apt.conf.d/01-apt-casher-ng-proxy"
           content: |
              Acquire::http::Proxy "http://{{ dnsmasq_gateway }}:{{ apt_cacher_ng_port }}";
           mode: '0644'

