- name: Download and unpack iso file if it does not exist
  # when: download_vmlinuz_file_stat.stat.exists == false
  block:
       - name: downloading iso files
         debug:
             msg: "preparing download files for  iso_url={{iso_url}} iso_name={{iso_name}} iso_file_path={{iso_file_path}} iso_mount_point={{iso_mount_point}}  Downloading the ISO can take a very long time"

       - name: Ensure directory for ISO file exists
         ansible.builtin.file:
           path: "{{iso_directory}}"
           state: directory
           mode: '0755'

       - name: Download ISO
         ansible.builtin.shell: |
           wget -O "{{iso_file_path}}" "{{iso_url}}"
         args:
           creates: "{{iso_file_path}}"

