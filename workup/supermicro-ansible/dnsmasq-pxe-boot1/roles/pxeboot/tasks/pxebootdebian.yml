  vars:
      os_id: "{{hostvars[item].os_id | default('', true) | trim }}"
      os_version_id: "{{ hostvars[item].os_version_id | default('', true) | trim }}"
      iso_name: "{{ operating_systems | selectattr('os_id', 'search', os_id)  | selectattr('os_version_id', 'equalto', os_version_id) | map(attribute='iso_name') | first }}"
      iso_url: "{{ operating_systems | selectattr('os_id', 'search', os_id)   | selectattr('os_version_id', 'equalto', os_version_id) | map(attribute='iso_url') | first }}"
      iso_file_path: "{{sharedisos}}/{{os_id}}/{{os_version_id}}/{{iso_name}}"
      iso_directory: "{{sharedisos}}/{{os_id}}/{{os_version_id}}"
      iso_mount_point : /tmp/iso/{{os_id}}/{{os_version_id}}
      
      
      
      
- name: create pxe boot files for inventory
  block:

       - name: Create tftp boot images directory
         ansible.builtin.file:
           path: "{{ tftp_root }}/{{ os_id }}/{{ os_version_id }}/bootimages"
           state: directory
           mode: '0755'
           
       - name: Create tftp isos directory
         ansible.builtin.file:
           path: "{{ tftp_root }}/{{ os_id }}/{{ os_version_id }}/isos"
           state: directory
           mode: '0755'

       - name: Copy debian iso to tftp root
         ansible.builtin.copy:
           src: "{{sharedisos}}/{{os_id}}/{{os_version_id}}/{{iso_name}}"
           dest: "{{ tftp_root }}/{{os_id}}/{{os_version_id}}/isos/{{iso_name}}"
           remote_src: true
           mode: '0644'


