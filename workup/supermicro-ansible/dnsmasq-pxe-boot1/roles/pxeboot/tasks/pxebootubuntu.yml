---

 - name: another debug
   debug:
     msg: "generating pxeboot config for os_id=ubuntu os_version_id= {{ hostvars[host].os_version_id | default('', true) | trim }}"
          
 - name: Create Ubuntu pxe Mac specific PXE menu
   ansible.builtin.copy:
      dest: "{{ tftp_root }}/pxelinux.cfg/{{ hostvars[host].eth0_mac }}"
      content: |
        DEFAULT menu.c32
        PROMPT 0
        TIMEOUT 100
        MENU TITLE PXE Boot Menu

        LABEL ubuntu
          MENU LABEL Install Ubuntu 24.04
          KERNEL ubuntu/vmlinuz
          INITRD ubuntu/initrd.img
          SYSAPPEND 3
          APPEND  url=http://{{ dnsmasq_gateway }}:8080/sharedisos/{{ubuntu_iso_name}} cloud-config-url=/dev/null autoinstall  ds=nocloud-net;s=http://{{ dnsmasq_gateway }}:8080/sharedisos/conf/default/ fsck.mode=skip
            
        LABEL local
          MENU LABEL Boot from local disk
          LOCALBOOT 0
      mode: '0644'
      when: hostvars[host].eth0_mac | default('', true) | trim !=''