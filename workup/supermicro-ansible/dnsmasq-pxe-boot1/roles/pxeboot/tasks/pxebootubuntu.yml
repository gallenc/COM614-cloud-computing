---
- name: debug preparefiles-ubuntu
  debug:
     msg: "peparing download files for os_id={{sharedisos}}/{{hostvars[item].os_id | default('', true) | trim }} os_version_id= {{ hostvars[item].os_version_id | default('', true) | trim }} }}"
     
- name: check if iso file exists
  stat: 
    path: "{{sharedisos}}/{{hostvars[item].os_id | default('', true) | trim }}/{{ hostvars[item].os_version_id | default('', true) | trim }} }}/{{ubuntu_iso_name}}"
  register: download_iso_file_stat
     
- name: Download and unpack iso file if it does not exist
 # when: download_iso_file_stat.stat.exists == false
  block:
       - name: downloading iso files
         debug:
             msg: "peparing download files for {{ubuntu_iso_url}}"
             
#       - name: Download ISO
#         ansible.builtin.get_url:
#            url: "{{ubuntu_iso_url}}"
#            dest: "{{iso_file_path}}"
#            # checksum: "sha256:https://example.com.sha256"
#            force: false # will not download if already exists

       - name: Ensure mount point exists
         ansible.builtin.file:
           path: "{{iso_mount_point}}"
           state: directory
           mode: '0755'

       - name: Mount ISO file as a loop device
         ansible.posix.mount:
           path: "{{iso_mount_point}}"
           src: "{{iso_file_path}}"
           fstype: iso9660
           opts: loop,ro
           state: mounted

       - name: Ensure bootimages folder exists
         ansible.builtin.file:
           path: "{{boot_images_path}}"
           state: directory
           mode: '0755'
           
       - name: Copy ubuntu kernel and initrd for PXE boot
         ansible.builtin.copy:
           # note casper folder is where the kernel and initrd are located in ubuntu iso
           src: "{{iso_mount_point}}/casper/{{ image_item }}"
           dest: "{{boot_images_path}}/{{ image_item }}"
           remote_src: true
           mode: '0777'
         loop:
           - vmlinuz
           - initrd
         loop_control:
           loop_var: image_item 

       - name: Unmount ISO file on Linux
         ansible.posix.mount:
           path: "{{iso_mount_point}}"
           src: "{{iso_file_path}}"
           state: unmounted
  vars:
      os_id: "{{hostvars[item].os_id | default('', true) | trim }}"
      os_version_id: "{{ hostvars[item].os_version_id | default('', true) | trim }}"
      iso_file_path: "{{sharedisos}}/{{os_id}}/{{os_version_id}}/{{ubuntu_iso_name}}"
      iso_mount_point : /tmp/iso/{{os_id}}/{{os_version_id}}
      boot_images_path: "{{sharedisos}}/{{os_id}}/{{os_version_id}}/bootimages"

- name: Create ftp directory
  ansible.builtin.file:
    path: "{{ tftp_root }}/{{hostvars[item].os_id | default('', true) | trim }}/{{ hostvars[item].os_version_id | default('', true) | trim }}/bootimages"
    state: directory
    mode: '0755'

# note must have unpacked iso here
- name: Copy ubuntu kernel and initrd for PXE boot to tftp root
  ansible.builtin.copy:
    src: "{{sharedisos}}/{{hostvars[item].os_id | default('', true) | trim }}/{{ hostvars[item].os_version_id | default('', true) | trim }}/bootimages/{{ image_item }}"
    dest: "{{ tftp_root }}/{{hostvars[item].os_id | default('', true) | trim }}/{{ hostvars[item].os_version_id | default('', true) | trim }}/bootimages/{{ image_item }}"
    remote_src: true
    mode: '0644'
  loop:
    - vmlinuz
    - initrd
  loop_control:
     loop_var: image_item 

- name: Create config directory
  ansible.builtin.file:
    path: "{{sharedisos}}/{{hostvars[item].os_id | default('', true) | trim }}/{{ hostvars[item].os_version_id | default('', true) | trim }}/conf/default"
    state: directory
    mode: '0755'

- name: Copy config files
  ansible.builtin.copy:
    src: ../files/{{hostvars[item].os_id | default('', true) | trim }}/{{ hostvars[item].os_version_id | default('', true) | trim }}/conf/default/{{ image_item }}
    dest: "{{sharedisos}}/{{hostvars[item].os_id | default('', true) | trim }}/{{ hostvars[item].os_version_id | default('', true) | trim }}/conf/default/{{ image_item }}"
    mode: '0644'
  loop:
    - meta-data
    - network-config
    - user-data
    - vendor-data
  loop_control:
     loop_var: image_item 


- name: debug pxebootubuntu.yml
  debug:
    msg: "generating pxeboot config for os_id={{hostvars[item].os_id | default('', true) | trim }} os_version_id= {{ hostvars[item].os_version_id | default('', true) | trim }} eth0_mac={{ hostvars[item].eth0_mac | default('', true) | trim }}"
          
- name: Create Ubuntu pxe Mac specific PXE menu
  ansible.builtin.copy:
     dest: "{{ tftp_root }}/pxelinux.cfg/01-{{ hostvars[item].eth0_mac  | replace(':','-') | lower }}"
     content: |
       DEFAULT menu.c32
       PROMPT 0
       TIMEOUT 100
       MENU TITLE PXE Boot Menu for {{ item }} eth0_mac={{ hostvars[item].eth0_mac }}

       LABEL ubuntu
         MENU LABEL Install Ubuntu 24.04
         KERNEL ubuntu/vmlinuz
         INITRD ubuntu/initrd
         SYSAPPEND 3
         APPEND  url=http://{{ dnsmasq_gateway }}:8080/sharedisos/{{hostvars[item].os_id | default('', true) | trim }}/{{ hostvars[item].os_version_id | default('', true) | trim }}/{{ubuntu_iso_name}} cloud-config-url=/dev/null autoinstall  ds=nocloud-net;s=http://{{ dnsmasq_gateway }}:8080/sharedisos/{{hostvars[item].os_id | default('', true) | trim }}/{{hostvars[item].os_id | default('', true) | trim }}/{{ hostvars[item].os_version_id | default('', true) | trim }}/conf/default/ fsck.mode=skip
            
       LABEL local
         MENU LABEL Boot from local disk
         LOCALBOOT 0
     mode: '0644'
