- name: Check DHCP leases
  ansible.builtin.command: cat /var/lib/dnsmasq/dnsmasq.leases
  register: leases
  changed_when: false

- name: Test DNS resolution
  ansible.builtin.command: "dig @localhost {{ item }} +short"
  loop:
    - server1.{{ dnsmasq_domain }}
    - google.com
  register: dns_test
  changed_when: false

- name: Check Dnsmasq status
  ansible.builtin.command: systemctl status dnsmasq
  register: dnsmasq_status
  changed_when: false

# check logs
- name: Check Dnsmasq logs
  ansible.builtin.command: "grep -i dhcp /var/log/dnsmasq.log | tail -20"
  register: dhcp_logs
  changed_when: false
  
# config validation
- name: Test config syntax
  ansible.builtin.command: dnsmasq --test
  register: config_test
  changed_when: false