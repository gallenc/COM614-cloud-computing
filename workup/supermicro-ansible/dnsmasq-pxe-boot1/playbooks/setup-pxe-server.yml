#  APPEND ip=eth1:dhcp boot=casper netboot=url url=http://{{ dnsmasq_gateway }}:8080/sharedisos/{{ubuntu_iso_name}}  rd.debug rd.break
# ip=enp1s0f1:dhcp 
#           INITRD ubuntu/initrd.img
